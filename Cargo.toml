[package]
name = "peep"
version = "0.1.0"
edition = "2024"
description = "A quiet terminal reader for Chinese novels"
rust-version = "1.88"
license = "MIT"
publish = false

[dependencies]
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
directories = "6.0"
ego-tree = "0.11"
encoding_rs = "0.8"
percent-encoding = "2.3"
ratatui = { version = "0.30", default-features = false, features = [
    "crossterm",
] }
roxmltree = "0.21"
scraper = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.15"
thiserror = "2.0"
unicode-segmentation = "1.12"
unicode-width = "0.2"
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
